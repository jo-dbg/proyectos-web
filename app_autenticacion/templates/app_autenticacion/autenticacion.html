{% extends 'app_autenticacion/base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="fondo-login d-flex align-items-center justify-content-center min-vh-100">
    <div class="card tarjeta-login shadow-lg border-0 p-4">
        <h2 class="text-center mb-1">Bienvenido</h2>
        <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
